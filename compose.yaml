name: agw-guardrail-lab
services:
  guardrails:
    build: ./guardrails
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${GUARDRAIL_PORT:-8080}:8080"
    volumes:
      - ./scenarios:/scenarios:ro
      - ./artifacts:/artifacts
    environment:
      SCENARIO_FILE: /scenarios/active.json
      JOURNAL_FILE: /artifacts/guardrails.jsonl
  mock:
    image: python:3.12-slim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - ./mock:/app:ro
      - ./scenarios:/scenarios:ro
      - ./artifacts:/artifacts
  gateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    command: ["-f", "/config/config.yaml"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./gateway:/config:ro
    depends_on:
      - guardrails
      - mock
  tests:
    profiles: [test]
    image: python:3.12-slim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["python", "-u", "/tests/run.py"]
    environment:
      LAB_RUN_ID: "${LAB_RUN_ID:-}"
    volumes:
      - ./tests:/tests:ro
      - ./scenarios:/scenarios
      - ./artifacts:/artifacts
